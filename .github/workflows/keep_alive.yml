name: Keep Streamlit App Alive (24/7)

on:
  schedule:
    # 每 20 分鐘 ping 一次，防止 Streamlit 進入休眠
    - cron: '*/20 * * * *'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Streamlit App
        run: |
          STREAMLIT_URL="https://c79p6iaujeyjubfmyygaqj.streamlit.app"
          echo "=== Pinging Streamlit App: $STREAMLIT_URL ==="
          echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S UTC')"

          # 第一次 ping（帶重試）
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 45 \
            --retry 3 \
            --retry-delay 10 \
            --retry-max-time 120 \
            -L \
            "$STREAMLIT_URL" 2>/dev/null || echo "000")

          echo "HTTP Response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "✅ Streamlit App is alive and responding!"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⏳ App may be cold-starting, waiting 30s and retrying..."
            sleep 30
            HTTP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 45 -L "$STREAMLIT_URL" 2>/dev/null || echo "000")
            echo "Retry HTTP Response: $HTTP_CODE2"
          else
            echo "⚠️  Unexpected response: $HTTP_CODE"
          fi

          echo "=== Ping complete ==="
